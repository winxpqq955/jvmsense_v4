[workspace]
resolver = "2"
members = [
    "apps/core",
]
exclude = [
    # Spikes are throwaway probes with their own lockfiles; keeping them out of
    # the workspace means `cargo test` at the root never tries to build them.
    "spikes",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
ristretto_classfile = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "2.4"
flate2 = "1.0"
sha2 = "0.10"
zstd = "0.13"
dashmap = "6.1"
dunce = "1.0"
tempfile = "3.15"
rand = "0.9"
parking_lot = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
jni = { version = "0.21", features = ["invocation"] }
minhook = "0.9"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
